[project]
name = "photo-album"
version = "0.1.0"
description = "Web-based Photo Album written in Python"
authors = [{name = "Alex M", email = "alex@alexos.dev"}]
license = {text = "GNU GPLv3"}
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "jinja2>=3.1.6",
    "jinja2-fragments>=1.12.0",
    "pytailwindcss>=0.3.1",
    "pillow>=12.3.0",
    "google-cloud-storage>=3.13.1",
    "PyJWT",
    "google-cloud-secret-manager>=2.30.0",
    "google-crc32c",
    "requests>=2.34.2",
    "authlib>=1.7.2",
    "itsdangerous>=2.2.0",
    "structlog>=26.1.0",
    "grpcio==1.83.0",  # pin gRPC due to MacOS issues in 1.65
    "google-cloud-firestore>=2.28.1",
    "uvicorn",
    "httpx>=0.28.1",
    "ruff>=0.16.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "flake8>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
